<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
            
      <div class="container">
        <div class="box">
         
          <div class="login_form">
            <h2 style="padding-bottom: 0px; text-align:center">Add quiz</h2>
            
            <form action="{{url_for('addquiz', chapter_id = chapter.id)}}" method="post">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">chapter ID</label>
                <input type="text" class="form-control" name="chapter_id" value="{{chapter.id}}" id="exampleInputEmail1" aria-describedby="emailHelp" disabled required>
                <div id="emailHelp" class="form-text"></div>
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">name</label>
                <input type="text" class="form-control" name="name" id="exampleInputPassword1">
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Date</label>
                <input type="date" class="form-control" name="date" id="exampleInputPassword1" required>
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Duration</label>
                <input type="text" class="form-control" name="duration" id="exampleInputPassword1" required>
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">remarks(if any)</label>
                <input type="text" class="form-control" name="remarks" id="exampleInputPassword1">
              </div>
              
              <div style="text-align: center; padding:15px">
                <input type="submit" class="btn btn-success" value="Save" style="text-align: center;">
                <a href="{{url_for('quizmanagement', chapter_id = chapter.id)}}" class="btn btn-primary"> close </a></div>
               
            </form>


            
          </div>
        </div>
      </div>


</body>
</html>
