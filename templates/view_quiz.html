<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>view quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <form>
      <h2 class="text-center">Upcoming quizzes</h2>
        <div class="row mb-3">
          <label for="inputEmail3" class="col-sm-2 col-form-label"> ID </label>
          <div class="col-sm-10">
            <input type="email" class="form-control" id="inputEmail3" disabled value="{{quiz.id}}">
          </div>
        </div>
        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label">Subject</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="inputPassword3" disabled value="{{subject.name}}">
          </div>
        </div>
        <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label">chapter</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="inputPassword3" disabled value="{{chapter.name}}">
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label"> </label>
            <div class="col-sm-10">
              <input type="text" value="{{quiz.questions | length}}" class="form-control" id="inputPassword3" disabled>
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label"> Scheduled date: </label>
            <div class="col-sm-10">
              <input type="text" value="{{quiz.date_of_quiz}}" class="form-control" id="inputPassword3" disabled>
            </div>
          </div>
          <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label"> Duration: </label>
            <div class="col-sm-10">
              <input type="text" value="{{quiz.time_duration}}" class="form-control" id="inputPassword3" disabled>
            </div>
          </div>
        
        <a href="{{url_for('user_dashboard', user_id = user.id)}}" class="btn btn-primary"> close </a>  
      </form>

</body>
</html>
