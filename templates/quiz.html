<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>quizzes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
  
    <div class="user">
      <h2>{{chapter.name}} {{quiz.name}} </h2>
      
      <form action="/start_quiz/{{quiz.id}}/{{user_id}}" method="post">
        {% for question in quiz.questions %}
        <div class="row mb-3">
          <input name="{{question.description}}" value = "{{question.question_statement}}" type="text"  disabled>
          <label for="inputPassword3" class="col-sm-2 col-form-label"></label>
      </div>
          <input id="option1" type="radio" name="{{question.id}}" value="1" />
          <label for="option1"> {{question.option_1}} </label>
        </div><div>
          <input id="option2" type="radio" name="{{question.id}}" value="2" />
          <label for="option2">{{question.option_2}}</label></div>
        <div>
          <input id="option3"  type="radio" name="{{question.id}}" value="3" />
          <label for="option3">{{question.option_3}}</label></div>
        <div>
          <input id="option4"  type="radio" name="{{question.id}}" value="4" />
          <label for="option4">{{question.option_4}}</label>
        </div>
        {%endfor%}
        <div style="text-align: center; padding:15px">
        <input type="submit" class="btn btn-success" value="submit" style="text-align: center;">
        </div>
      </form>
        </div>
   
</body>
</html>
