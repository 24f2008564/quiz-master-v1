<!DOCTYPE html>
<html lang="en">
<head>

<body>
    <form action="{{url_for('editsubject', subject_id = subject.id)}}" method="post">
        <div class="row mb-3">
          <label for="inputEmail3" class="col-sm-2 col-form-label"> ID </label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="inputEmail3" disabled value="{{subject.id}}">
          </div>
        </div>
        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label">Subject</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="inputPassword3" name = "subject" value="{{subject.name}}">
          </div>
        </div>
        <div class="row mb-3">
            <textarea name="Description" class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>

            <label for="inputPassword3" class="col-sm-2 col-form-label">description</label>
            
        </div>
        <input type="submit" value="update" class="btn btn-primary">   
      </form>
