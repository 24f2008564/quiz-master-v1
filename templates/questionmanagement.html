<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>question management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
        {% if not quiz.questions %}
        No questions for {{quiz.name}}
        <a href="{{url_for('addquestion',quiz_id = quiz.id)}}" class="btn-btn-success">Add question</a>
        {%else%}
        <table class="table">
            {{quiz.name}} questions
            <thead>
              <tr>
                <th scope="col"> S.no </th>
                <th scope="col"> Q_title </th>
                <th scope="col"> Action </th>
              </tr>
            </thead>
            <tbody>
              {% for question in quiz.questions %}
                <tr>
                <th scope="row"> {{loop.index}} </th>
                <td> {{question.question_title}} </td>
                <td>  <a href="{{url_for('editquestion', question_id = question.id)}}">edit/</a><a href="{{url_for('deletequestion', question_id = question.id)}}">delete</a></td>              
              </tr>
              {%endfor%}
              <a href="{{url_for('addquestion',quiz_id = quiz.id)}}" class="btn-btn-success">Add question</a>
            </tbody>
          </table>
          {%endif%}
          <a href="{{url_for('quizmanagement', chapter_id = chapter.id)}}" class="btn-btn-success">Back to quiz management</a>
</body>
</html>
