<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add subject</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    {{message}}
    <div class="container">
        <div class="box">
         
          <div class="login_form">
            <h2 style="padding-bottom: 0px; text-align:center">New Subject</h2>
            
            <form action="{{url_for('addsubject')}}" method="post">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label" >Enter the subject</label>
                <input type="text" class="form-control" name="subject" id="exampleInputEmail1" required>
              </div>
              <!--<div class="mb-3">-->
                <div class="form-floating">
                  <textarea name="Description" class="form-control" placeholder="Leave a comment here" id="floatingTextarea2" style="height: 100px"></textarea>
                  <label for="floatingTextarea2">Description</label>
                </div>
                
             <!-- </div>-->
              
              <div style="text-align: center; padding:15px">
              <input type="submit" class="btn btn-success" value="Save" style="text-align: center;">
              <!-- <input type="submit" class="btn btn-success" value="Cancel" style="text-align: center;"> -->
              <a href="{{url_for('admin')}}" class="btn btn-primary"> close </a> 
            </form>
          </div>
        </div>
      </div>
</body>
</html>
