<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <div class="box">
          <div class="register_form">
            <h2 style="padding-bottom: 0px; text-align:center">Register</h2>
            <form action="{{url_for('register')}}" method="post">
              <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label" >Username</label>
                <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" name = "Username">
                
              </div>
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label"> Password</label>
                <input type="password" class="form-control" id="exampleInputPassword1" name = "Password">
              </div>
              <div class="mb-3">
                <label for="exampleInputfullname" class="form-label"> Fullname</label>
                <input type="text" class="form-control" id="exampleInputfullname" name = "Fullname">
              </div>
              <div class="mb-3">
                <label for="exampleInputQualification" class="form-label"> Qualification</label>
                <input type="text" class="form-control" id="exampleInputQualification" name = "Qualification">
              </div>
              <div class="mb-3">
                <label for="exampleInputDOB" class="form-label"> Date of birth</label>
                <input type="date" class="form-control" id="exampleInputDOB" name = "DOB">
              </div>
              <div style=  "text-align: center">
              <input type="submit" value="Register" style="text-align: center;">
              <a href="{{url_for('login')}}">Go to login</a></div>
            </form>

            
          </div>
        </div>
      </div>

</body>
</html>
