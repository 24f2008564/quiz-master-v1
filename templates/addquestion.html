<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add question</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <div class="container">
        <div class="box">
         
          <div class="login_form">
            <h2 style="padding-bottom: 0px; text-align:center">New Question</h2>
            
            <form action="{{url_for('addquestion',quiz_id = quiz.id)}}" method="post">
              <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Ouestion_title</label>
                <input type="text" class="form-control" name="question_title" id="exampleInputPassword1" required>
              </div>
                <div class="row mb-3">
                  <label for="inputPassword3" class="col-sm-2 col-form-label">Question Description</label>  
                  <textarea name="question description" class="form-control"  id="floatingTextarea2" style="height: 100px" required></textarea>
                </div>
                <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Option 1</label>
                    <input type="text" class="form-control" name="option 1" id="exampleInputPassword1" required>
                  </div>
                
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Option 2</label>
                    <input type="text" class="form-control" name="option 2" id="exampleInputPassword1" required>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Option 3</label>
                    <input type="text" class="form-control" name="option 3" id="exampleInputPassword1" required>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Option 4</label>
                    <input type="text" class="form-control" name="option 4" id="exampleInputPassword1" required>
                  </div>
                  <div class="mb-3">
                    <label for="exampleInputPassword1" class="form-label">Correct option</label>
                    <input type="text" class="form-control" name="correct option" id="exampleInputPassword1" required>
                  </div>
            </div>
               
              <div style="text-align: center; padding:15px">
              <input type="submit" class="btn btn-success" value="Save" style="text-align: center;">
              <a href="{{url_for('questionmanagement', quiz_id = quiz.id)}}" class="btn btn-primary">close</a>
              </div>
            </form>
          </div>
        </div>
      </div>
</body>
</html>
