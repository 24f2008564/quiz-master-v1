<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <form action="{{url_for('editchapter', chapter_id = chapter.id)}}" method="post">
        <div class="row mb-3">
          <label for="inputEmail3" class="col-sm-2 col-form-label"> ID </label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="inputEmail3" disabled value="{{chapter.id}}">
          </div>
        </div>
        <div class="row mb-3">
          <label for="inputPassword3" class="col-sm-2 col-form-label">chapter</label>
          <div class="col-sm-10">
            <input type="text" class="form-control" id="inputPassword3" name = "chaptername" value="{{chapter.name}}">
          </div>
        </div>
        <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label">subject</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="inputPassword3" name = "subjectname" value="{{subject.name}}">
            </div>
          </div>
        <div class="row mb-3">
            <label for="inputPassword3" class="col-sm-2 col-form-label">description</label>
            <div class="col-sm-10">
              <input type="text" class="form-control" id="inputPassword3" name="description" value="{{chapter.description}}">
            </div>
        </div>
        <input type="submit" value="update" class="btn btn-success">  
      </form>
</body>
</html>
