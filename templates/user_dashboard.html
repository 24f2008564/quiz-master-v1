<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user dashboard</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarTogglerDemo03" aria-controls="navbarTogglerDemo03" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <a class="navbar-brand" href="{{url_for('user_dashboard', user_id = ext_user.id)}}">Home</a>
          <div class="collapse navbar-collapse" id="navbarTogglerDemo03">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="{{url_for('scores', user_id = ext_user.id)}}">scores</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="{{url_for('summaryuser', user_id = ext_user.id)}}">summary</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="/">Logout</a>
              </li>
              <li class="nav-item">
                <a class="nav-link"> {{ext_user.fullname}}'s dashoboard </a>
              </li>
            </ul>
            <form class="d-flex" role="search" action = "/user/search">
              <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search" name = "us">
              <button class="btn btn-outline-success"   type="submit">Search</button>
            </form>
          </div>
        </div>
      </nav>
      <br>
   
    <div class="user"  style="margin: 10%;">
     
      <table class="table">
        <thead>
          <tr>
            <th scope="col"> ID </th>
            <th scope="col"> No of questions </th>
            <th scope="col"> duration </th>
            <th scope="col"> Action </th>
          </tr>
        </thead>
        {% if not quizzes %}
        <h2>No quizzes avavilable here</h2>
        
        {%else%}
        {% for quiz in quizzes %}
            <tbody>
              <tr>
                <th scope="row"> {{loop.index}} </th>
                <td> {{quiz.name}}  </td>
                <td> {{quiz.time_duration}}  </td>               
                <td><a href="/view_quiz/{{quiz.id}}/{{ext_user.id}}" class="btn btn-primary">View</a> <a href="/start_quiz/{{quiz.id}}/{{ext_user.id}}" class="btn btn-primary">start</a></td>

              </tr>
              
            </tbody>
        {%endfor%}
        {%endif%}

      </table>
    </div>
    <strong><h1 style="text-align: center; "> {{msg}} </h1> </strong> 
    </body>
</html>
