<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz management</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
       {% if not chapter.quizzes %}
        <h1> no quizzes available <a href="{{url_for('addquiz', chapter_id = chapter.id)}}" style="color: red;">+addquiz</a> </h1> 

        {% else %}
          
            
            <div class="user">
                <table class="table">
                  <h2>{{chapter.name}} Quizzes</h2>
                    <thead>
                      <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Q_title</th>
                        <th scope="col">Action</th>
                        <th scope="col"> no of questions </th>
                      </tr>
                    </thead>
                    
                    <tbody>
                      {% for quiz in chapter.quizzes %}
                      <tr>
                        <th scope="row"> {{loop.index}} </th>
                        <td>  <a href="{{url_for('questionmanagement', quiz_id = quiz.id)}}">{{quiz.name}}</a></td>
                        <td>  <a href="{{url_for('editquiz', quiz_id = quiz.id)}}">edit/</a><a href="{{url_for('deletequiz', quiz_id = quiz.id)}}">delete</a></td>
                        <th scope="row"> {{quiz.questions|length}} </th>
                      </tr>
                      {%endfor%}
                    </tbody>
                   
                    <a  class="btn btn-primary" href = "{{url_for('addquiz',chapter_id = chapter.id)}}" >add quiz</a>
                  </table>
                </div>
        {% endif %}  

        <a href="{{url_for('admin')}}" class="btn btn-primary" style="text-align: center;">Back to admin dashboard</a>
</body>
</html>
